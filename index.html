const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = 'vb-xuanchinh-key';
async function open_(raw){
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: ub(P.iv)}, k, ub(P.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt: ub(P.salt), iterations: P.iter}, base, 256));
}
(async () => {
  let saved = null; try { saved = localStorage.getItem(KEY); } catch(e) {}
  if (saved) { try { await open_(ub(saved)); return; } catch(e) { try { localStorage.removeItem(KEY); } catch(_) {} } }
})();
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = 'Đang mở…';
  try {
    const raw = await derive(document.getElementById('pw').value);
    const test = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    await crypto.subtle.decrypt({name:'AES-GCM', iv: ub(P.iv)}, test, ub(P.ct));
    if (document.getElementById('rem').checked) { try { localStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch(e) {} }
    await open_(raw);
  } catch(e) { err.textContent = 'Sai mật khẩu, vui lòng thử lại.'; btn.disabled = false; }
});
